name: privacy-bundle-check
description: Fail the job when a built .app / .xcarchive is missing a PrivacyInfo.xcprivacy, has a duplicate manifest, or uses a Required Reason API without an approved reason.
author: privacy-bundle-check contributors
inputs:
  path:
    description: Path to a .app, .xcarchive, or directory, relative to the workspace
    required: true
  mode:
    description: "bundle (default; scan the built artifact) or project (walk source and xcprivacy)"
    required: false
    default: bundle
  strict:
    description: "If true, also fail on warnings"
    required: false
    default: "false"
outputs:
  exit-code:
    description: "0 = OK, 1 = missing / undeclared / duplicate (etc.), 2 = input error"
runs:
  using: node24
  main: dist/index.cjs
branding:
  icon: shield
  color: purple
